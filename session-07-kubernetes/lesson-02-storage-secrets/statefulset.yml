apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mysql

spec:
  selector:
    matchLabels:
      app: mysql

  serviceName: mysql
  replicas: 1

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
        - name: mariadb
          image: docker.io/mariadb:10.4

          ports:
            - containerPort: 3306
              protocol: TCP

          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mariadb-volume-1

      volumes:
        - emptyDir: {}
          name: mariadb-volume-1
